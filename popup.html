<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipeline Button</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="32" height="32" role="img">
        <defs>
          <linearGradient id="markGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#3b8ede" />
            <stop offset="100%" stop-color="#0a66c2" />
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="32" height="32" rx="9" fill="url(#markGradient)" />
        <path d="M16 9v14M9 16h14" stroke="#ffffff" stroke-width="2.75" stroke-linecap="round" />
      </svg>
    </span>
    <div class="header-text">
      <h1 class="header-title">Pipeline Button</h1>
      <p class="header-sub">LinkedIn &rarr; Monday, in one click</p>
    </div>
    <span id="conn-pill" class="pill pill--idle">Not set up</span>
  </header>

  <main class="body">
    <section class="field">
      <label class="label" for="token-input">Monday API token</label>
      <div class="control">
        <input
          id="token-input"
          class="input input--mono"
          type="password"
          placeholder="Paste your personal API token"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="toggle-token" class="reveal" type="button" aria-label="Show or hide token">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <path d="M1.5 10S4.9 4.5 10 4.5 18.5 10 18.5 10 15.1 15.5 10 15.5 1.5 10 1.5 10Z"
                  fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <circle cx="10" cy="10" r="2.75" fill="none" stroke="currentColor" stroke-width="1.6" />
          </svg>
        </button>
      </div>
    </section>

    <section class="field">
      <label class="label" for="board-input">Board ID</label>
      <input
        id="board-input"
        class="input input--mono"
        type="text"
        placeholder="e.g. 1234567890"
        autocomplete="off"
        spellcheck="false"
        inputmode="numeric"
      />
    </section>

    <button id="save-btn" class="btn" type="button">Save settings</button>

    <div id="status-box" class="status-box hidden"></div>

    <section id="history-section" class="section hidden">
      <div class="section-head">
        <span class="label">Recently added</span>
        <button id="clear-history" class="link-btn" type="button">Clear</button>
      </div>
      <ul id="history-list" class="history-list"></ul>
    </section>
  </main>

  <footer class="footer">
    <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" class="footer-icon">
      <path d="M8 1.5 13.5 4v4c0 3.2-2.3 5.6-5.5 6.5C4.8 13.6 2.5 11.2 2.5 8V4L8 1.5Z"
            fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
    </svg>
    <span>Token stays in this browser. Sent only to api.monday.com.</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
